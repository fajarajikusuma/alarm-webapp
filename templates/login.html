{% extends "base.html" %}
{% block title %}Login — Web Alarm{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top:2.5rem">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4 col-xl-3">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo"><i class="bi bi-alarm-fill"></i></div>
        <h5 class="mb-1 fw-700" style="color:#fff;font-size:1.05rem">Selamat Datang</h5>
        <p style="color:var(--text-muted);font-size:.78rem;margin:0">Web Alarm System</p>
      </div>
      <div class="p-3 p-sm-4">
        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" name="email"
                     placeholder="admin@domain.com" required autocomplete="email"/>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" name="password"
                     placeholder="••••••••" required autocomplete="current-password"/>
            </div>
          </div>
          <div class="mb-4 form-check ms-1">
            <input type="checkbox" class="form-check-input" id="remember" name="remember"/>
            <label class="form-check-label" for="remember"
                   style="font-size:.82rem;color:var(--text-muted)">Ingat saya</label>
          </div>
          <button type="submit" class="btn btn-primary-grad w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login
          </button>
        </form>
      </div>
      <div class="text-center pb-3" style="font-size:.8rem;color:var(--text-muted)">
        Belum punya akun?
        <a href="{{ url_for('register') }}" style="color:#818cf8;font-weight:600">Daftar</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
